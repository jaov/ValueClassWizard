OpenIDE-Module-Name=Value Class Wizard
OpenIDE-Module-Short-Description=Adds a Value Class template to the New submenu.
OpenIDE-Module-Long-Description=The Value Class wizard creates an immutable Java class with private final fields, an all-arguments constructor, getters, equals(), hashCode(), and toString(). Optional withX() methods can be generated per field or for the whole class. The Insert Code action Withable... adds withX() methods to existing classes. Field types are imported automatically when they can be resolved from the project classpath.

