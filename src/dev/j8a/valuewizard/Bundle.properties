OpenIDE-Module-Name=Value Class Wizard
OpenIDE-Module-Short-Description=Adds a Value Class template and staged Builder actions.
OpenIDE-Module-Long-Description=The Value Class wizard creates an immutable Java class with private final fields, an all-arguments constructor, getters, equals(), hashCode(), and toString(). Optional withX() methods can be generated per field or for the whole class. An optional staged Builder can also be generated; every field must be set before build() is available. The Insert Code actions Withable... and Builder add withX() methods or a staged builder to existing classes. Field types are imported automatically when they can be resolved from the project classpath.

